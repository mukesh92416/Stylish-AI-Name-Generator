<!DOCTYPE html>
<html>
<head>
    <title>Stylish Name Generator</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'home/style.css' %}?">
</head>
<body>

<div class="container">
    <h1 class="title">S𝘵𝘺𝘭𝘪𝘴𝘩 N𝘢𝘮𝘦 G𝘦𝘯𝘦𝘳𝘢𝘵𝘰𝘳</h1>

    <form method="post" class="form">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Enter your name" required value="{{ name }}">
        <button type="submit">Generate</button>
    </form>

    {% if results %}
        <div class="results">
            {% for item in results %}
                <div class="result-card">
                    <span>{{ item.text }}</span>
                    <button onclick="copyText('{{ item.text }}')">Copy</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
</div>

<script>
function copyText(text) {
    navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
