{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stylish Name Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS -->
<link rel="stylesheet" href="{% static 'home/style.css' %}">

<style>
/* fallback style if css fails */
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
    gap: 15px;
    margin-top: 20px;
}

.result-card {
    background: #020617;
    border-radius: 12px;
    padding: 15px;
}

button {
    cursor: pointer;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav style="background:#020617;padding:15px;text-align:center;">
    <a href="/" style="color:white;margin:0 10px;">Home</a>
    <a href="/stylish-name-generator/" style="color:white;margin:0 10px;">
        Generator
    </a>
</nav>

<div class="container">

<h1>Stylish Name Generator ✨</h1>

<!-- FORM -->
<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Enter your name"
           value="{{ name }}"
           style="padding:12px;width:80%;border-radius:8px;border:none;">

    <br><br>

    <button style="padding:12px 20px;border:none;border-radius:8px;">
        Generate
    </button>
</form>

<!-- FILTERS -->
<div style="margin-top:20px;">
    <button onclick="filterStyles('all')">All</button>
    <button onclick="filterStyles('gaming')">Gaming</button>
    <button onclick="filterStyles('cute')">Cute</button>
    <button onclick="filterStyles('royal')">Royal</button>
    <button onclick="filterStyles('dark')">Dark</button>
    <button onclick="filterStyles('fancy')">Fancy</button>
</div>

<!-- COPY ALL -->
<div style="margin:20px;">
    <button onclick="copyAll()">Copy All Styles</button>
</div>

<!-- RESULTS -->
<div class="results-grid">

{% for item in results %}
<div class="result-card" data-category="{{ item.category }}">

    <div class="styled-text">{{ item.text }}</div>

    <button onclick="copyText(this)" style="margin-top:10px;">
        Copy
    </button>

</div>
{% endfor %}

</div>

<!-- BIOS -->
{% if bios %}
<h2>Bio Ideas</h2>

{% for bio in bios %}
<div class="result-card">{{ bio }}</div>
{% endfor %}

{% endif %}

</div>

<!-- ================= JS ================= -->
<script>
function copyText(btn){
    const text =
        btn.parentElement
           .querySelector(".styled-text")
           .innerText;

    navigator.clipboard.writeText(text);

    btn.innerText = "Copied!";
    setTimeout(()=>btn.innerText="Copy",1000);
}

function copyAll(){
    let texts = document.querySelectorAll(".styled-text");
    let all="";

    texts.forEach(t=>{
        if(t.parentElement.style.display !== "none")
            all += t.innerText + "\n";
    });

    navigator.clipboard.writeText(all);
    alert("All styles copied!");
}

function filterStyles(cat){
    document.querySelectorAll(".result-card")
        .forEach(card=>{
            if(cat==="all" ||
               card.dataset.category===cat)
                card.style.display="block";
            else
                card.style.display="none";
        });
}
</script>

</body>
</html>
